<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="397" viewBox="0 0 1080 397" role="img" aria-label="从商机来源到持续跟进"><rect width="100%" height="100%" rx="20" fill="#f5f6fa"/><text x="42" y="54" font-size="28" font-weight="700" fill="#17202a" font-family="PingFang SC,Microsoft YaHei,sans-serif">从商机来源到持续跟进</text><text x="42" y="90" font-size="17" fill="#667085" font-family="PingFang SC,Microsoft YaHei,sans-serif">业务关系示意 · 非生产架构图 · 不表示全部自动运行</text><text x="42" y="154" font-size="19" font-weight="700" fill="#946d15" font-family="PingFang SC,Microsoft YaHei,sans-serif">信息进入</text><rect x="205" y="128" width="244" height="84" rx="12" fill="white" stroke="#d9dee7"/><text x="223" y="158" font-size="20" font-weight="700" fill="#17202a" font-family="PingFang SC,Microsoft YaHei,sans-serif">来源与公告</text><text x="223" y="188" font-size="16" fill="#344054" font-family="PingFang SC,Microsoft YaHei,sans-serif">保留可核对的信息</text><text x="456" y="175" font-size="22" fill="#b1841b">→</text><rect x="480" y="128" width="244" height="84" rx="12" fill="white" stroke="#d9dee7"/><text x="498" y="158" font-size="20" font-weight="700" fill="#17202a" font-family="PingFang SC,Microsoft YaHei,sans-serif">采集与筛选</text><text x="498" y="188" font-size="16" fill="#344054" font-family="PingFang SC,Microsoft YaHei,sans-serif">归集业务相关线索</text><text x="731" y="175" font-size="22" fill="#b1841b">→</text><rect x="755" y="128" width="244" height="84" rx="12" fill="white" stroke="#d9dee7"/><text x="773" y="158" font-size="20" font-weight="700" fill="#17202a" font-family="PingFang SC,Microsoft YaHei,sans-serif">人工确认</text><text x="773" y="188" font-size="16" fill="#344054" font-family="PingFang SC,Microsoft YaHei,sans-serif">决定是否继续跟进</text><text x="42" y="270" font-size="19" font-weight="700" fill="#946d15" font-family="PingFang SC,Microsoft YaHei,sans-serif">业务使用</text><rect x="205" y="244" width="244" height="84" rx="12" fill="white" stroke="#d9dee7"/><text x="223" y="274" font-size="20" font-weight="700" fill="#17202a" font-family="PingFang SC,Microsoft YaHei,sans-serif">客户与商机</text><text x="223" y="304" font-size="16" fill="#344054" font-family="PingFang SC,Microsoft YaHei,sans-serif">整理关联关系</text><text x="456" y="291" font-size="22" fill="#b1841b">→</text><rect x="480" y="244" width="244" height="84" rx="12" fill="white" stroke="#d9dee7"/><text x="498" y="274" font-size="20" font-weight="700" fill="#17202a" font-family="PingFang SC,Microsoft YaHei,sans-serif">跟进与结果</text><text x="498" y="304" font-size="16" fill="#344054" font-family="PingFang SC,Microsoft YaHei,sans-serif">保留原状态与历史</text><text x="731" y="291" font-size="22" fill="#b1841b">→</text><rect x="755" y="244" width="244" height="84" rx="12" fill="white" stroke="#d9dee7"/><text x="773" y="274" font-size="20" font-weight="700" fill="#17202a" font-family="PingFang SC,Microsoft YaHei,sans-serif">反馈与迭代</text><text x="773" y="304" font-size="16" fill="#344054" font-family="PingFang SC,Microsoft YaHei,sans-serif">形成后续改进任务</text></svg>
